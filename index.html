<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anand Mahadevan weds Akshaya — Wedding Invitation</title>
  <meta name="description" content="Join us in the wedding celebrations of Abhishek & Kanika" />

  <!-- Google Fonts matching exact City-3 Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Aboreto&family=Cormorant+Infant:wght@400&family=Cormorant+Unicase:wght@400&family=Cormorant+Upright:wght@400;700&family=Cormorant:wght@400;600&family=Gotu&family=Manrope:wght@600&family=Yaldevi:wght@400&display=swap"
    rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div id="top" class="page-root">

    <!-- ====================================================================
         1. FLOATING MUSIC TOGGLE BUTTON
         ==================================================================== -->
    <div class="music-sticky-bar" aria-label="Background Music Controls">
      <div class="music-btn-wrapper">
        <button id="music-toggle-btn" class="music-btn" type="button" aria-label="Play music">
          <audio id="wedding-audio" src="assets/music.mp3" loop preload="metadata"></audio>
          <svg id="music-icon-svg" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M 5.379 1.292 C 4.968 1.033 4.449 1.017 4.023 1.251 C 3.598 1.486 3.334 1.933 3.333 2.419 L 3.333 13.581 C 3.334 14.067 3.598 14.514 4.023 14.749 C 4.449 14.983 4.968 14.967 5.379 14.708 L 14.215 9.127 C 14.602 8.883 14.836 8.457 14.836 8 C 14.836 7.543 14.602 7.117 14.215 6.873 Z"
              fill="#333" />
          </svg>
        </button>
      </div>
    </div>

    <!-- ====================================================================
         2. MAIN CONTAINER (max-width: 1500px)
         ==================================================================== -->
    <main class="main-container">

      <!-- ==================================================================
           SECTION 1: HERO, INVITE DETAILS & 6 WEDDING EVENTS
           ================================================================== -->
      <section class="section-1" aria-label="Hero and Wedding Invitation">

        <!-- Sky Layer 1 (Base Sky) -->
        <div class="hero-sky-1">
          <div class="bg-wrapper bg-top">
            <picture>
              <source media="(max-width: 1399.98px)" srcset="assets/sky-1-mobile.png" />
              <img src="assets/sky-1-desktop.png" alt="" decoding="async" />
            </picture>
          </div>
        </div>

        <!-- Sky Layer 2 (Cross-Fades in over 8.5s) -->
        <div id="hero-sky-2" class="hero-sky-2">
          <div class="bg-wrapper bg-top">
            <picture>
              <source media="(max-width: 1399.98px)" srcset="assets/sky-2-mobile.jpg" />
              <img src="assets/sky-2-desktop.png" alt="" decoding="async" />
            </picture>
          </div>
        </div>

        <!-- Couple's Names with Scroll Parallax & Staggered Tilt Entrance -->
        <div id="hero-couple-container" class="hero-couple-container">
          <div class="hero-couple-names">
            <p id="hero-groom" class="hero-word word-groom">Abhishek</p>
            <p id="hero-weds" class="hero-word word-weds">weds</p>
            <p id="hero-bride" class="hero-word word-bride">Kanika</p>
          </div>
        </div>

        <!-- Architectural Palace Structure + 240Hz Falling Petals Canvas -->
        <div id="hero-structure" class="hero-structure">
          <div class="bg-wrapper">
            <picture>
              <source media="(max-width: 809.98px)" srcset="assets/palace-mobile.png" />
              <img src="assets/palace-desktop.png" alt="Wedding Palace Illustration" decoding="async" />
            </picture>
          </div>

          <div id="petals-canvas-container" class="petals-canvas-container">
            <canvas id="petals-canvas"></canvas>
          </div>
        </div>

        <!-- Mandala Design 1: Location CTA -->
        <div class="invite-and-events">
          <!-- Ornate Arch Section Background -->
          <div class="bg-wrapper bg-top">
            <picture>
              <source media="(max-width: 809.98px)" srcset="assets/section1-bg-mobile.png" />
              <img src="assets/section1-bg-desktop.png" alt="" decoding="async" />
            </picture>
          </div>

          <!-- Sticky Scroll-Translated CTA: Rotating Mandala Medallion (See the Route) -->
          <div id="location" class="cta-sticky-section cta-location-section">
            <div class="cta-scroll-mover">
              <div class="mandala-medallion mandala-location">
                <!-- Layer 1: Rotating Outer Mandala Ring (10s ease-in-out mirror + scroll rotation) -->
                <div class="mandala-ring-outer" data-mandala-ring>
                  <img id="cta-location-ring-img" src="assets/mandala-ring-location.png" alt="" loading="lazy"
                    decoding="async" />
                </div>
                <!-- Layer 2: Static Inner Medallion Circle -->
                <div class="mandala-circle-inner">
                  <img id="cta-location-inner-img" src="assets/mandala-inner-location.png" alt="" loading="lazy"
                    decoding="async" />
                </div>
                <!-- Layer 3: Centered Text & Action Link -->
                <div class="mandala-content">
                  <a id="cta-location-btn" class="cta-text-block cta-text-link" href="https://maps.google.com" target="_blank"
                    rel="noopener noreferrer" aria-label="Open venue location on Google Maps">
                    <h2 id="cta-location-headline" class="cta-headline">See the&#10;route</h2>
                    <p id="cta-location-subtext" class="cta-subtext">Click to open the map</p>
                  </a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- ==================================================================
           SECTION 2: MANDALA DESIGN 2 (RSVP ON WHATSAPP)
           ================================================================== -->
      <section class="section-2" aria-label="RSVP">
        <div class="bg-wrapper">
          <img src="assets/section2-bg.png" alt="" loading="lazy" decoding="async" />
        </div>

        <!-- Sticky Scroll-Translated CTA: Rotating Mandala Medallion (RSVP on WhatsApp) -->
        <div id="rsvp" class="cta-sticky-section cta-rsvp-section">
          <div class="cta-scroll-mover">
            <div class="mandala-medallion mandala-rsvp">
              <!-- Layer 1: Rotating Outer Mandala Ring (10s ease-in-out mirror + scroll rotation) -->
              <div class="mandala-ring-outer" data-mandala-ring>
                <img id="cta-rsvp-ring-img" src="assets/mandala-ring-rsvp.png" alt="" loading="lazy" decoding="async" />
              </div>
              <!-- Layer 2: Static Inner Medallion Circle -->
              <div class="mandala-circle-inner">
                <img id="cta-rsvp-inner-img" src="assets/mandala-inner-rsvp.png" alt="" loading="lazy"
                  decoding="async" />
              </div>
              <!-- Layer 3: Centered Text & Action Link -->
              <div class="mandala-content">
                <a id="cta-rsvp-btn" class="cta-text-block cta-text-link"
                  href="https://wa.me/919999999999" target="_blank" rel="noopener noreferrer"
                  aria-label="Click to RSVP on WhatsApp">
                  <h2 id="cta-rsvp-headline" class="cta-headline">Please&#10;rsvp</h2>
                  <p id="cta-rsvp-subtext" class="cta-subtext">Click to message on WhatsApp</p>
                </a>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- ==================================================================
           SECTION 3: MANDALA DESIGN 3 (INSTAGRAM CTA)
           ================================================================== -->
      <section class="section-3" aria-label="Instagram">
        <div class="bg-wrapper">
          <picture>
            <source media="(max-width: 809.98px)" srcset="assets/section3-bg-mobile.png" />
            <img src="assets/section3-bg-desktop.png" alt="" loading="lazy" decoding="async" />
          </picture>
        </div>

        <!-- Sticky Scroll-Translated CTA: Rotating Mandala Medallion (Instagram) -->
        <div id="instagram" class="cta-sticky-section cta-instagram-section">
          <div class="cta-scroll-mover">
            <div class="mandala-medallion mandala-instagram">
              <!-- Layer 1: Rotating Outer Mandala Ring (10s ease-in-out mirror + scroll rotation) -->
              <div class="mandala-ring-outer" data-mandala-ring>
                <img id="cta-instagram-ring-img" src="assets/mandala-ring-instagram.png" alt="" loading="lazy"
                  decoding="async" />
              </div>
              <!-- Layer 2: Static Inner Medallion Circle -->
              <div class="mandala-circle-inner">
                <img id="cta-instagram-inner-img" src="assets/mandala-inner-instagram.png" alt="" loading="lazy"
                  decoding="async" />
              </div>
              <!-- Layer 3: Centered Text & Action Link -->
              <div class="mandala-content">
                <a id="cta-instagram-btn" class="cta-text-block cta-text-link"
                  href="https://instagram.com" target="_blank" rel="noopener noreferrer"
                  aria-label="Open our Instagram page">
                  <h2 id="cta-instagram-headline" class="cta-headline">Follow the&#10;action</h2>
                  <p id="cta-instagram-subtext" class="cta-subtext">Click to open our Instagram page</p>
                </a>
              </div>
            </div>
          </div>
        </div>
      </section>

    </main>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>

</html>
