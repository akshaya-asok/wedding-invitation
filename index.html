<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anand Mahadevan weds Akshaya — Wedding Invitation</title>
  <meta name="description" content="Join us in the wedding celebrations of Abhishek & Kanika" />

  <!-- Google Fonts matching exact City-3 Typography + Merienda & Satisfy -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Aboreto&family=Cormorant+Infant:wght@400;700&family=Cormorant+Unicase:wght@400&family=Cormorant+Upright:wght@400;700&family=Cormorant:wght@400;600&family=Gotu&family=Manrope:wght@600&family=Merienda:wght@400;600;700&family=Satisfy&family=Yaldevi:wght@400&display=swap"
    rel="stylesheet" />

  <link rel="preload" as="image" href="assets/petal.png" />
  <link rel="preload" as="audio" href="assets/music.mp3" type="audio/mpeg" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div id="top" class="page-root">

    <!-- ====================================================================
         1. FLOATING MUSIC TOGGLE BUTTON
         ==================================================================== -->
    <div class="music-sticky-bar" aria-label="Background Music Controls">
      <div class="music-btn-wrapper">
        <button id="music-toggle-btn" class="music-btn" type="button" aria-label="Pause music">
          <audio id="wedding-audio" src="assets/music.mp3" autoplay preload="auto"></audio>
          <svg id="music-icon-svg" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
            <rect x="3.5" y="2" width="3.2" height="12" rx="1" fill="currentColor"></rect>
            <rect x="9.3" y="2" width="3.2" height="12" rx="1" fill="currentColor"></rect>
          </svg>
        </button>
      </div>
    </div>

    <!-- ====================================================================
         2. MAIN CONTAINER (max-width: 1500px)
         ==================================================================== -->
    <main class="main-container">

      <!-- ==================================================================
           SECTION 1: HERO, INVITE DETAILS & 6 WEDDING EVENTS
           ================================================================== -->
      <section class="section-1" aria-label="Hero and Wedding Invitation">

        <!-- Sky Layer 1 (Base Sky) -->
        <div class="hero-sky-1">
          <div class="bg-wrapper bg-top">
            <picture>
              <source media="(max-width: 1399.98px)" srcset="assets/sky-1-mobile.png" />
              <img src="assets/sky-1-desktop.png" alt="" decoding="async" />
            </picture>
          </div>
        </div>

        <!-- Sky Layer 2 (Cross-Fades in over 8.5s) -->
        <div id="hero-sky-2" class="hero-sky-2">
          <div class="bg-wrapper bg-top">
            <picture>
              <source media="(max-width: 1399.98px)" srcset="assets/sky-2-mobile.jpg" />
              <img src="assets/sky-2-desktop.png" alt="" decoding="async" />
            </picture>
          </div>
        </div>

        <!-- Couple's Names with Scroll Parallax & Staggered Tilt Entrance -->
        <div id="hero-couple-container" class="hero-couple-container">
          <div class="hero-couple-names">
            <p id="hero-groom" class="hero-word word-groom">Anand Mahadevan</p>
            <p id="hero-weds" class="hero-word word-weds">weds</p>
            <p id="hero-bride" class="hero-word word-bride">Akshaya</p>
          </div>
        </div>

        <!-- 240Hz Falling Petals Canvas (Starts showering immediately from top) -->
        <div id="petals-canvas-container" class="petals-canvas-container">
          <canvas id="petals-canvas"></canvas>
        </div>

        <!-- Architectural Palace Structure -->
        <div id="hero-structure" class="hero-structure">
          <div class="bg-wrapper">
            <picture>
              <source media="(max-width: 809.98px)" srcset="assets/palace-mobile.png" />
              <img src="assets/palace-desktop.png" alt="Wedding Palace Illustration" decoding="async" />
            </picture>
          </div>
        </div>

        <!-- Unified Mandala Medallions Section (dream.jpg on mobile, dream1.jpg on website/desktop) -->
        <div class="invite-and-events">
          <!-- Single Continuous Dream Background Layer -->
          <div class="bg-wrapper">
            <picture>
              <source media="(max-width: 809.98px)" srcset="assets/dream.jpg" />
              <img src="assets/dream1.jpg" alt="" decoding="async" />
            </picture>
          </div>

          <!-- Simple Aesthetic Invitation Card -->
          <div class="glass-projection-wrapper">
            <div class="glass-projection-card">
              <p class="glass-invite-heading">Together with our families, we invite you to celebrate our love at our wedding reception!</p>
              <p class="glass-invite-date">23 Jan 2027 at 4.30 pm</p>
              <p class="glass-invite-location">at Mount Carmel Convention Centre, Vazhuthacaud</p>
            </div>
          </div>

          <!-- Mandala Design 1: Yellow Mandala — Location CTA (See the Route) -->
          <div id="location" class="cta-sticky-section cta-location-section">
            <div class="cta-scroll-mover">
              <div class="mandala-medallion mandala-location">
                <!-- Layer 1: Rotating Outer Mandala Ring (Yellow Mandala) -->
                <div class="mandala-ring-outer" data-mandala-ring>
                  <img id="cta-location-ring-img" src="assets/mandala-ring-instagram.png" alt="" loading="lazy"
                    decoding="async" />
                </div>
                <!-- Layer 2: Static Inner Medallion Circle (Soft Beige/Yellow with Brown Rings) -->
                <div class="mandala-circle-inner">
                  <img id="cta-location-inner-img" src="assets/mandala-inner-instagram.png" alt="" loading="lazy"
                    decoding="async" />
                </div>
                <!-- Layer 3: Centered Text & Full-Mandala Clickable Map Link -->
                <a id="cta-location-btn" class="mandala-full-link"
                  href="https://www.google.com/maps/search/?api=1&query=Mount+Carmel+Convention+Centre+Vazhuthacaud+Thiruvananthapuram"
                  target="_blank" rel="noopener noreferrer" aria-label="Open Mount Carmel Convention Centre, Vazhuthacaud on Google Maps">
                  <span class="mandala-content">
                    <span class="cta-text-block">
                      <h2 id="cta-location-headline" class="cta-headline">See the&#10;route</h2>
                      <p id="cta-location-subtext" class="cta-subtext">Click to open the map</p>
                    </span>
                  </span>
                </a>
              </div>
            </div>
          </div>

          <!-- Photo 1 (1we) Under First Mandala with Simple Aesthetic Border -->
          <div class="framed-photo-slot framed-photo-slot-1">
            <figure class="custom-framed-photo simple-aesthetic-frame framed-photo-1">
              <div class="framed-photo-inside framed-photo-inside-1">
                <img src="assets/1we.jpeg" alt="Anand Mahadevan and Akshaya" loading="lazy" decoding="async" />
              </div>
            </figure>
          </div>

          <!-- Mandala Design 2: Pink Mandala — RSVP Guest Count Input & Google Form Submit -->
          <div id="rsvp" class="cta-sticky-section cta-rsvp-section">
            <div class="cta-scroll-mover">
              <div class="mandala-medallion mandala-rsvp">
                <!-- Layer 1: Rotating Outer Mandala Ring -->
                <div class="mandala-ring-outer" data-mandala-ring>
                  <img id="cta-rsvp-ring-img" src="assets/mandala-ring-rsvp.png" alt="" loading="lazy" decoding="async" />
                </div>
                <!-- Layer 2: Static Inner Medallion Circle -->
                <div class="mandala-circle-inner">
                  <img id="cta-rsvp-inner-img" src="assets/mandala-inner-rsvp.png" alt="" loading="lazy"
                    decoding="async" />
                </div>
                <!-- Layer 3: Centered RSVP Guest Count Input & Submit -->
                <div class="mandala-content">
                  <div class="cta-text-block rsvp-form-block">
                    <label for="rsvp-guest-count" class="rsvp-trigger-label">
                      <h2 id="cta-rsvp-headline" class="cta-headline">Please&#10;RSVP</h2>
                      <p id="cta-rsvp-subtext" class="cta-subtext">Add guest count here</p>
                    </label>
                    <form id="rsvp-count-form" class="mandala-rsvp-form" novalidate>
                      <div class="rsvp-input-group">
                        <input id="rsvp-guest-count" class="rsvp-count-input" type="number" name="guestCount"
                          min="1" max="50" placeholder="Count" required aria-label="Number of guests attending" />
                        <button id="rsvp-submit-btn" class="rsvp-submit-btn" type="submit">Submit</button>
                      </div>
                      <p id="rsvp-status-msg" class="rsvp-status-msg" aria-live="polite"></p>
                    </form>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Photo 2 (2we) Under Second Mandala (Borderless Aesthetic Blend) -->
          <div class="framed-photo-slot framed-photo-slot-2">
            <figure class="custom-framed-photo borderless-aesthetic-photo framed-photo-2">
              <div class="framed-photo-inside framed-photo-inside-2">
                <img src="assets/2we.jpeg" alt="Anand Mahadevan and Akshaya" loading="lazy" decoding="async" />
              </div>
            </figure>
          </div>

          <!-- Stylized Plain Text Closing Message Under Second Picture -->
          <div class="closing-greeting-wrapper">
            <h2 class="closing-greeting-text">We can&rsquo;t wait to see you there!</h2>
          </div>
        </div>
      </section>

    </main>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>

</html>
